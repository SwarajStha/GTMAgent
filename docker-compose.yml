services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm
    ports:
      # Direct (Alembic / DDL)
      - "5432:5432"
      # Pooled alias for app runtime (same container, just a second host port)
      - "6543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/00-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the DB is reachable as `db:5432` for both
      # connection strings — port 6543 is a host-side alias only.
      DATABASE_URL: postgresql+psycopg://gtm:gtm@db:5432/gtm
      DATABASE_URL_DIRECT: postgresql+psycopg://gtm:gtm@db:5432/gtm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      # app/matching/lr_weights.py resolves the trained model at
      # <repo-root>/exports/model_params.json (parents[3] from its own file,
      # counted from inside /app/app/matching — i.e. container-root /exports).
      # The build context is ./backend only, so without this mount the model
      # never loads and matching silently falls back to the weaker legacy
      # scorer. Mounted read-write on purpose: feedback retraining
      # (POST /api/v1/feedback/retrain, and the scheduler's reflection cycle)
      # writes model_params_feedback.json here, so :ro would break it. That
      # generated file is gitignored, so a retrain leaves the tree clean.
      - ./exports:/exports

  frontend:
    build:
      context: ./frontend
    environment:
      # The dev-server proxy's default (localhost:8000) only works when the
      # frontend runs on the host next to a host-run backend. Inside Compose,
      # "localhost" in the frontend container is the frontend container itself
      # — reach the backend via its Docker network hostname instead.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
