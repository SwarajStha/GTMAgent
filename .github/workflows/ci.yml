name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtm
          POSTGRES_DB: gtm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gtm -d gtm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      # tests/conftest.py reads this URL via Settings.database_url_test
      DATABASE_URL_TEST: postgresql+psycopg://gtm:gtm@localhost:5432/gtm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Create test database
        env:
          PGPASSWORD: gtm
        run: |
          psql -h localhost -U gtm -d gtm -c "CREATE DATABASE gtm_test;"
          psql -h localhost -U gtm -d gtm_test -c "CREATE EXTENSION vector;"
      - name: Run pytest
        run: pytest tests -v

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtm
          POSTGRES_DB: gtm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gtm -d gtm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://gtm:gtm@localhost:5432/gtm
      DATABASE_URL_DIRECT: postgresql+psycopg://gtm:gtm@localhost:5432/gtm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run alembic upgrade head
        run: alembic upgrade head
